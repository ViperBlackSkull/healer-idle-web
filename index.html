<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <!-- Q-7 (HI-153): the installable-app surface — icons + manifest; the
         service worker itself registers from main.ts, PROD builds only. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- HI-176 (rescued off the loop-drain strand): the authored icon of
         record — public/favicon.svg + the public/icons/ PNG ladder, all
         generated by scripts/make-icons.py (the generator of record; the
         electron .ico ships the same identity). Supersedes HI-197's inline
         data-URI favicon: same authored identity, now file-based so the
         generator owns every size from one source. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Healer Idle</title>
    <!-- HI-450 (minimalism plan §4.9): the first-paint frame. Every visual —
         fonts, style.css, all of it — arrives inside main.ts's module graph,
         so between HTML parse and that graph executing there is no CSS at
         all: the raw skeleton painted BOTH grammar-hint variants
         concatenated (no rule yet hides .hint-coarse) plus three dead chrome
         buttons on an unstyled frame, and nothing anywhere said "loading".
         This block is the whole loading screen: the frame goes calmly dark,
         one title line holds the moment, and main.ts's tail sets
         <html class="booted"> — every hiding rule scopes to :not(.booted),
         so the real stylesheet owns the frame the instant it exists and
         this layer retires for good. -->
    <style>
      html { background: #0a0d14; }
      html:not(.booted) #app { display: none; }
      /* the coarse (tap) half of the grammar line stays hidden until real
         CSS picks the pointer's variant — pre-CSS both spans concatenate */
      html:not(.booted) .hint-coarse { display: none; }
      #boot-title {
        position: fixed;
        inset: 0;
        z-index: 9999; /* under the boot guard's failure card (99999) */
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 0%, #0a0d14 0%, #05070a 100%);
        font-family: Alegreya, Georgia, 'Times New Roman', serif;
        font-size: clamp(20px, 3vw, 28px);
        letter-spacing: 0.6px;
        color: #d4a329;
      }
      html.booted #boot-title { display: none; }
      @media (prefers-reduced-motion: no-preference) {
        #boot-title { animation: hi450-breathe 1.9s ease-in-out infinite; }
      }
      @keyframes hi450-breathe { 50% { opacity: 0.5; } }
    </style>
    <script type="module" crossorigin src="./assets/index-n_Eor-Ar.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/data-agCZyRmB.js">
    <link rel="modulepreload" crossorigin href="./assets/game-obwQ5SqU.js">
    <link rel="modulepreload" crossorigin href="./assets/camp-B0fkCFck.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CyfBZPg3.css">
    <link rel="stylesheet" crossorigin href="./assets/vendor-BNhwaEzg.css">
  </head>
  <body>
    <!-- HI-450: the one-line title card — the only real loading-screen
         moment the game has; main.ts removes it once the first real frame
         is dressed behind it. (The HI-176 strand's boot-veil variant was
         superseded by this newer first-paint frame — same intent, the
         minimalism plan's authored take.) -->
    <div id="boot-title">Healer Idle</div>
    <!-- The battle scene owns the whole screen (checkpoint-shop directive,
         2026-09-02): no persistent side panels — zones and spells are chosen
         in the death shop that opens on every wipe. The slim header strip is
         an overlay on top of the scene. -->
    <div id="app">
      <!-- HI-365: the camp wallpaper, truly full-bleed. One fixed plate
           keyed by body.at-camp (render.ts mode wiring) paints camp.jpg
           across the whole viewport — over the bottom chrome band, not
           letterboxed above it. It paints UNDER the stage content (the
           resting scene keeps its actors, fire, and motes) and under the
           floating chrome (#spell-bar / #header hold z-indexes above it);
           pointer-events:none keeps every click it overlaps reachable. -->
      <div id="camp-fullbleed" aria-hidden="true"></div>
      <main id="stage-wrap">
        <div id="stage" class="zone-0">
          <!-- World dressing (atmospherics pass): two backdrop plates hold the
               per-zone layered backdrops (far sky / mid silhouettes / near
               ground); ui/render.ts ping-pongs them for a ~700ms crossfade on
               zone change. Plate A ships live on zone 0 so first paint is
               already dressed. -->
          <div id="stage-bg" aria-hidden="true">
            <div class="bg-layers plate-a zone-0 live">
              <div class="bg-far"></div>
              <div class="bg-mid"></div>
              <div class="bg-near"></div>
            </div>
            <div class="bg-layers plate-b">
              <div class="bg-far"></div>
              <div class="bg-mid"></div>
              <div class="bg-near"></div>
            </div>
          </div>
          <div id="zone-banner"></div>
          <!-- actors are created by ui/render.ts -->
          <div id="fx-layer">
            <!-- Drifting ambient motes (fireflies / dust / embers). One
                 container so reduced-motion can empty it wholesale; it lives
                 in the fx layer (the stage's particle stratum). -->
            <div id="ambient" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
          <!-- The campfire (paused-camp dressing): layered CSS flame tongues
               + a warm pulsing light wash where the enemy stood. Opacity is
               driven entirely by #stage.at-camp (ui/render.ts mode wiring). -->
          <div id="campfire" aria-hidden="true">
            <div class="fire-glow"></div>
            <i class="flame f1"></i>
            <i class="flame f2"></i>
            <i class="flame f3"></i>
            <i class="flame f4"></i>
            <i class="log log-a"></i>
            <i class="log log-b"></i>
          </div>
          <div id="vignette" aria-hidden="true"></div>
          <!-- The caster mark — the armed-spell badge and every outgoing
               heal's origin (HI-105: the persona body is gone; the mark
               stands where the healer stands). HI-283: it starts "bare" —
               silent while Heal (the default) is armed; the DOM node stays
               as the beam origin either way. -->
          <div id="caster-mark" class="bare">✚</div>
        </div>
        <div id="spell-bar">
          <!-- slots are built by ui/render.ts (4 slots: Heal locked into #1) -->
          <div id="spell-slots"></div>
          <!-- HI-310 (the echo leash): Smartcast II's state, spoken at the
               bar — rank 2 only (render.ts owns the text; absent below rank
               2 so the a11y tree never carries it). -->
          <div id="smartcast-echo" hidden></div>
         <!-- Q-7 (HI-153): the grammar line speaks per pointer — keys for a
               keyboard, taps for a thumb. Two spans, CSS picks by hover
               ability; no JS, no layout shift (only one is ever displayed).
               HI-182/HI-213: the fine span's text is the static first-paint
               copy of CONTROL_HINT (src/ui/onboarding.ts) — main.ts stamps
               the shared constant into the span at boot, so the teacher and
               the bar can never drift (the stamp targets the SPAN, never the
               whole line: flattening it would mute the tap grammar).
               HI-451: the copy is the THREE-clause shape (aim · cast · the
               fantasy line) at every rank — the full key map is disclosed
               in Settings › Controls, never carried by this line. -->
          <div class="spell-hint"><span class="hint-fine">Q / W / E or click an ally to aim · 1–5 cast that spell at your target · nobody heals for you</span><span class="hint-coarse">Tap an ally to aim · tap a spell to cast on them · nobody heals for you · Camp retreats — the zone restarts on return</span></div>
        </div>
      </main>
      <header id="header">
        <div id="hd-title">Healer <span class="accent">Idle</span></div>
        <!-- HI-161: the tag opens the patch notes (CHANGELOG.md, ?raw at build time) -->
        <button id="hd-version" class="hd-version-tag" title="Patch notes — what changed & what to test"></button>
        <div id="hd-level"></div>
        <div id="hd-xp"><div class="bar"><div class="fill" id="hd-xp-fill"></div></div><span id="hd-xp-text"></span></div>
        <div id="hd-mana"><div class="bar"><div class="fill" id="hd-mana-fill"></div></div><span id="hd-mana-text"></span></div>
        <div id="hd-gold"></div>
        <div id="hd-marks" title="Marks — the rare mint: first clears, Deathless oaths, new Deep floors. Attune at the chronicle." hidden></div>
        <div class="spacer"></div>
        <button id="hd-camp" title="Camp & Skill Tree (C)">🏕️ Camp</button>
        <button id="hd-mute" title="Toggle sound (M)">🔊</button>
      </header>
    </div>
    <div id="overlay-root"></div>
  </body>
</html>
